<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenders Watch — Singapore tender tracker</title>
<meta name="description" content="Weekly scan of Singapore tenders — junk disposal, handyman, skip tank.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F3F5F1; --panel:#FFFFFF; --panel-2:#FAFBF8;
    --ink:#17211D; --muted:#68746E; --faint:#93A099;
    --line:#E7EBE5; --hair:#EFF2EC;
    --brand:#0E7B58; --brand-2:#0A5E43;
    --direct:#0E7B58; --bundle:#B0730F;
    --danger:#CB4A34; --amber:#C1841A;
    --direct-bg:#E7F3ED; --bundle-bg:#F7EEDD;
    --danger-bg:#F9E7E2; --amber-bg:#F8EFD9; --ok-bg:#E7F3ED;
    --head-bg:#111E19; --head-ink:#ECF2EE; --head-faint:#8AA096; --head-line:#24352D;
    --shadow:0 1px 2px rgba(18,30,24,.05), 0 12px 28px -16px rgba(18,30,24,.18);
    --radius:14px;
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
  *{box-sizing:border-box; margin:0}
  html{-webkit-text-size-adjust:100%; color-scheme:light}
  body{background:var(--bg); color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif; font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
  a{color:inherit}
  ::selection{background:color-mix(in srgb, var(--brand) 26%, transparent)}
  .pad{padding-inline:clamp(16px,4vw,48px)}

  /* ---------- header ---------- */
  header{background:var(--head-bg); color:var(--head-ink);
    padding-block:20px; display:flex; flex-wrap:wrap; gap:16px 20px; align-items:center;
    border-bottom:1px solid var(--head-line)}
  .brand{display:flex; align-items:center; gap:13px; min-width:0}
  .mark{position:relative; width:38px; height:38px; border-radius:11px; flex:none;
    background:radial-gradient(120% 120% at 30% 20%, var(--brand-2), var(--head-bg) 140%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); display:grid; place-items:center}
  .mark::before{content:""; width:15px; height:15px; border-radius:50%;
    border:2px solid var(--brand); box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%, transparent)}
  .mark::after{content:""; position:absolute; width:5px; height:5px; border-radius:50%; background:var(--brand);
    box-shadow:0 0 10px 1px var(--brand); animation:ping 2.6s ease-out infinite}
  @keyframes ping{0%{transform:scale(.6); opacity:.4} 60%{transform:scale(1.9); opacity:0} 100%{opacity:0}}
  header h1{font-weight:800; font-size:23px; letter-spacing:-.4px; line-height:1}
  header h1 span{color:var(--brand)}
  .tagline{font-size:12px; color:var(--head-faint); margin-top:4px; letter-spacing:.2px}
  .status{margin-left:auto; display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--head-faint);
    background:rgba(255,255,255,.04); border:1px solid var(--head-line);
    padding:7px 12px; border-radius:999px; white-space:nowrap}
  .status .pulse{width:7px; height:7px; border-radius:50%; background:var(--brand); flex:none;
    box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 60%, transparent); animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%, transparent)}
    70%{box-shadow:0 0 0 7px transparent} 100%{box-shadow:0 0 0 0 transparent}}

  /* ---------- KPI strip ---------- */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding-top:22px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 16px; position:relative; overflow:hidden; box-shadow:var(--shadow)}
  .kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--faint); opacity:.5}
  .kpi.hot::before{background:var(--danger); opacity:1}
  .kpi.fresh::before{background:var(--brand); opacity:1}
  .kpi.warn::before{background:var(--amber); opacity:1}
  .kpi-n{font-weight:800; font-size:27px; letter-spacing:-.5px; line-height:1.05; font-variant-numeric:tabular-nums}
  .kpi.hot .kpi-n{color:var(--danger)} .kpi.fresh .kpi-n{color:var(--brand)} .kpi.warn .kpi-n{color:var(--amber)}
  .kpi-l{font-size:12px; color:var(--muted); margin-top:5px; font-weight:600; letter-spacing:.2px}
  .src-kpi{cursor:pointer; text-align:left; overflow:visible; appearance:none; -webkit-appearance:none; font:inherit; color:inherit; transition:border-color .15s}
  .src-kpi:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
  .src-kpi .kpi-n{display:flex; align-items:center; gap:8px}
  .caret{width:12px; height:12px; color:var(--faint); transition:transform .18s; margin-top:2px}
  .src-kpi.open .caret{transform:rotate(180deg)}
  .src-menu{position:absolute; top:calc(100% + 8px); left:0; min-width:100%; width:max-content; max-width:340px; z-index:40;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
    padding:6px; display:none}
  .src-kpi.open .src-menu{display:block}
  .src-menu-h{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--faint); padding:8px 10px 6px}
  .src-item{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; font-size:13px; white-space:nowrap}
  .src-item i{width:8px; height:8px; border-radius:50%; flex:none}
  .src-item.ok i{background:var(--brand)} .src-item.fail i{background:var(--danger)}
  .src-item .sn{flex:1; font-weight:600}
  .src-item .sc{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink); font-weight:600; margin-left:auto}
  .src-item .scanned{color:var(--faint); font-weight:400}
  .src-item.fail{color:var(--danger)} .src-item.fail .sc{color:var(--danger)}
  .src-menu-note{font-size:10.5px; color:var(--faint); padding:9px 10px 3px; margin-top:4px; border-top:1px solid var(--hair); line-height:1.5}

  /* ---------- toolbar ---------- */
  .bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding-block:18px 4px}
  .tabs{display:inline-flex; background:var(--panel); border:1px solid var(--line);
    border-radius:11px; padding:3px; box-shadow:var(--shadow)}
  .tabs button{font:inherit; font-weight:700; font-size:14px; padding:7px 16px; background:none;
    border:none; cursor:pointer; color:var(--muted); border-radius:8px; transition:.15s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{background:var(--ink); color:var(--panel)}
  .search{position:relative; flex:1 1 240px; min-width:180px}
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none}
  input[type=search]{width:100%; font:inherit; font-size:14px; padding:9px 12px 9px 34px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; box-shadow:var(--shadow)}
  input[type=search]::placeholder{color:var(--faint)}
  select{font:inherit; font-size:14px; padding:9px 30px 9px 12px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); border-radius:10px; cursor:pointer; box-shadow:var(--shadow);
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%2393A099' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center}
  .chip{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--muted);
    cursor:pointer; padding:9px 13px; border:1px solid var(--line); background:var(--panel);
    border-radius:10px; box-shadow:var(--shadow); user-select:none; transition:.15s}
  .chip input{position:absolute; opacity:0; width:0; height:0}
  .chip::before{content:""; width:15px; height:15px; border-radius:5px; border:1.5px solid var(--faint); flex:none; transition:.15s}
  .chip:has(input:checked){color:var(--brand); border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
  .chip:has(input:checked)::before{background:var(--brand); border-color:var(--brand);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>")}
  .grow{flex:1}
  .xlsx{font:inherit; font-weight:700; font-size:14px; padding:9px 16px; background:var(--brand);
    color:#fff; border:none; cursor:pointer; border-radius:10px; box-shadow:var(--shadow); transition:.15s}
  .xlsx:hover{background:var(--brand-2)}
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{
    outline:2px solid var(--brand); outline-offset:2px}

  /* ---------- table ---------- */
  main{padding-bottom:70px}
  .count{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); padding:14px 2px 12px}
  .board{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden}
  table{width:100%; border-collapse:collapse; table-layout:fixed}
  th{font-size:11px; text-transform:uppercase; letter-spacing:.7px; text-align:left; font-weight:700;
    color:var(--faint); padding:13px 14px; background:var(--panel-2); border-bottom:1px solid var(--line); white-space:nowrap}
  td{padding:14px; border-bottom:1px solid var(--hair); vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tr.item{transition:background .12s}
  tr.item:hover{background:var(--panel-2)}
  .c-tender{position:relative; max-width:540px}
  .c-tender::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent}
  tr.item.direct .c-tender::before{background:var(--direct)}
  tr.item.bundle .c-tender::before{background:var(--bundle)}
  .title{font-weight:700; font-size:14.5px; letter-spacing:-.1px; display:block; overflow-wrap:anywhere}
  .buyer{color:var(--muted); font-size:12.5px; margin-top:3px}
  a.titlelink{text-decoration:none; display:block}
  a.titlelink:hover .title, a.titlelink:focus-visible .title{color:var(--brand)}
  .dt{color:var(--muted); font-size:12.5px; white-space:nowrap}
  .src-cell{font-size:12px}
  .src-cell .ref{color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  a.src{color:var(--brand); font-weight:600; text-decoration:none}
  a.src:hover{text-decoration:underline}

  .tag{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.3px;
    padding:4px 9px 4px 8px; border-radius:999px; white-space:nowrap}
  .tag i{width:6px; height:6px; border-radius:50%; flex:none}
  .tag.direct{color:var(--direct); background:var(--direct-bg)} .tag.direct i{background:var(--direct)}
  .tag.bundle{color:var(--bundle); background:var(--bundle-bg)} .tag.bundle i{background:var(--bundle)}

  .cd{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; padding:4px 9px;
    border-radius:8px; display:inline-block; white-space:nowrap; border:1px solid transparent}
  .cd.ok{color:var(--brand); background:var(--ok-bg)}
  .cd.soon{color:var(--amber); background:var(--amber-bg)}
  .cd.now{color:var(--danger); background:var(--danger-bg)}
  .cd.gone{color:var(--faint); border-color:var(--line); border-style:dashed}
  .cd.none{color:var(--faint)}
  .new{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:9.5px; letter-spacing:.5px;
    color:#fff; background:var(--brand); padding:2px 5px; border-radius:5px; margin-left:6px; vertical-align:1px}

  td.act{text-align:right; width:44px}
  .del{width:28px; height:28px; display:inline-grid; place-items:center; font-size:13px; line-height:1;
    border:1px solid var(--line); background:var(--panel); color:var(--faint); cursor:pointer;
    border-radius:8px; transition:.14s}
  .del:hover{border-color:var(--danger); color:var(--danger); background:var(--danger-bg)}
  .copyref{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:500; padding:2px 7px;
    border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer; border-radius:6px; white-space:nowrap; transition:.14s}
  .copyref:hover{border-color:var(--brand); color:var(--brand)}
  .linkbtn{background:none; border:none; color:var(--brand); font:inherit; font-weight:700; cursor:pointer; padding:0}
  .linkbtn:hover{text-decoration:underline}
  .show-m{display:none}
  .empty{padding:60px 24px; text-align:center; color:var(--muted)}
  .empty b{display:block; font-size:16px; color:var(--ink); margin-bottom:6px; font-weight:700}

  /* ---------- toast ---------- */
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--panel); padding:11px 10px 11px 18px; font-size:13.5px; font-weight:600;
    display:none; align-items:center; gap:12px; box-shadow:0 12px 30px -8px rgba(0,0,0,.45); z-index:60;
    border-radius:12px; opacity:0; transition:opacity .18s, transform .18s}
  #toast.show{display:flex; opacity:1; transform:translateX(-50%) translateY(0)}
  #toast button{background:color-mix(in srgb,var(--brand) 24%, transparent); border:none; color:var(--brand);
    font:inherit; font-weight:700; cursor:pointer; padding:6px 12px; border-radius:8px}
  #toast button:hover{background:color-mix(in srgb,var(--brand) 34%, transparent)}

  /* ---------- footer ---------- */
  footer{padding-block:22px 40px; border-top:1px solid var(--line); margin-top:26px; color:var(--muted)}
  .health-head{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--faint); margin-bottom:11px}
  .health-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
  .src-chip{display:inline-flex; align-items:center; gap:7px; font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; padding:5px 11px; border:1px solid var(--line); border-radius:999px; background:var(--panel)}
  .src-chip i{width:7px; height:7px; border-radius:50%; flex:none}
  .src-chip.ok i{background:var(--brand)} .src-chip.fail i{background:var(--danger)}
  .src-chip.fail{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
  .health-note{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--faint)}

  /* ---------- mobile ---------- */
  @media (max-width:760px){
    header{padding-block:16px}
    .status{margin-left:0; width:100%; justify-content:flex-start}
    .kpis{grid-template-columns:repeat(2,1fr); padding-top:18px}
    .bar{gap:8px}
    .tabs{flex:1 1 100%; order:-2}
    .tabs button{flex:1}
    .search{flex:1 1 100%; order:-1}
    select{flex:1 1 42%}
    .chip{flex:1 1 100%; justify-content:center}
    .grow{display:none}
    .xlsx{flex:1 1 100%}
    .hide-m{display:none!important}
    .show-m{display:inline}
    .board{background:transparent; border:none; box-shadow:none; overflow:visible}
    table,tbody{display:block}
    thead{display:none}
    tr.item{display:grid; grid-template-columns:1fr auto; gap:8px 12px; align-items:center;
      background:var(--panel); border:1px solid var(--line); border-left-width:3px; border-radius:12px;
      margin-bottom:10px; padding:14px 14px 14px 16px; box-shadow:var(--shadow)}
    tr.item.direct{border-left-color:var(--direct)}
    tr.item.bundle{border-left-color:var(--bundle)}
    tr.item:hover{background:var(--panel)}
    .c-tender::before{display:none}
    td{display:block; padding:0; border:none!important}
    .c-tender{grid-column:1 / -1; max-width:none}
    td.act{width:auto; grid-row:1; grid-column:2; text-align:right}
    .c-tender{grid-row:1; grid-column:1}
  }
</style>
</head>
<body>
<header class="pad">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>Tenders<span>Watch</span></h1>
      <div class="tagline">Singapore tenders · junk disposal · handyman · skip tank</div>
    </div>
  </div>
  <div class="status"><span class="pulse"></span><span id="runAt">loading…</span></div>
</header>

<section class="kpis pad" id="kpis" aria-label="Overview"></section>

<div class="bar pad">
  <div class="tabs" role="tablist">
    <button id="tabLive" class="on" onclick="setTab('live')">Live</button>
    <button id="tabArch" onclick="setTab('archive')">Archive</button>
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="q" placeholder="Search title, buyer, ref…" oninput="render()">
  </div>
  <select id="fit" onchange="render()">
    <option value="">All fits</option>
    <option>Direct fit</option>
    <option>Bundle/subcon</option>
  </select>
  <select id="src" onchange="render()"><option value="">All sources</option></select>
  <label class="chip"><input type="checkbox" id="soon" onchange="render()"><span>Closing ≤ 7 days</span></label>
  <div class="grow"></div>
  <button class="xlsx" onclick="downloadXlsx()">↓ Excel</button>
</div>

<main class="pad">
  <div class="count" id="count"></div>
  <div class="board">
    <table>
      <colgroup>
        <col>
        <col style="width:88px">
        <col style="width:150px">
        <col style="width:100px">
        <col style="width:120px">
        <col style="width:96px">
        <col style="width:106px">
        <col style="width:48px">
      </colgroup>
      <thead><tr>
        <th>Tender</th>
        <th>Fit</th>
        <th class="hide-m">Source / Ref</th>
        <th class="hide-m">Published</th>
        <th>Scanned</th>
        <th>Closes</th>
        <th>Countdown</th>
        <th class="act" aria-label="Actions"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden><b>No tenders match.</b>Adjust your filters, or wait for the next Monday scan.</div>
  </div>
</main>

<div id="toast"><span class="msg">Tender hidden.</span><button>Undo</button></div>

<footer class="pad" id="health">source health: loading…</footer>

<script>
let LIVE=[], ARCH=[], STATUS={}, tab='live', srcOpen=false;
const fmt = d => d ? new Date(d+'T00:00:00').toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'2-digit'}) : '—';

function daysLeft(iso){
  if(!iso) return null;
  const t0 = new Date(); t0.setHours(0,0,0,0);
  return Math.round((new Date(iso+'T00:00:00') - t0)/86400000);
}

function stamp(iso){
  const d = daysLeft(iso);
  if(d===null) return '<span class="cd none">—</span>';
  if(d<0)  return '<span class="cd gone">Lapsed</span>';
  if(d===0) return '<span class="cd now">Today</span>';
  const cls = d<=3 ? 'now' : (d<=7 ? 'soon' : 'ok');
  return `<span class="cd ${cls}">D-${d}</span>`;
}

function setTab(t){
  tab=t;
  document.getElementById('tabLive').classList.toggle('on', t==='live');
  document.getElementById('tabArch').classList.toggle('on', t==='archive');
  render();
}

function data(){ return tab==='live' ? LIVE : ARCH; }

function updateKpis(){
  const live = LIVE.filter(t=>!DISMISSED.has(keyOf(t)));
  const soon = live.filter(t=>{const d=daysLeft(t.closing); return d!==null && d>=0 && d<=7;}).length;
  const fresh = live.filter(isNew).length;
  const entries = Object.entries(STATUS.sources||{});
  const ok = entries.filter(([,v])=>v.ok).length;
  const bySrc = {};
  live.forEach(t=>{ bySrc[t.source] = (bySrc[t.source]||0)+1; });
  const seen = new Set();
  const rows = entries.map(([k,v])=>{
    seen.add(k);
    const lc = bySrc[k]||0;
    const right = v.ok ? `${lc}<span class="scanned"> / ${v.fetched??0}</span>` : 'failed';
    return `<div class="src-item ${v.ok?'ok':'fail'}"><i></i><span class="sn">${esc(k)}</span><span class="sc">${right}</span></div>`;
  });
  Object.keys(bySrc).filter(k=>!seen.has(k)).forEach(k=>
    rows.push(`<div class="src-item"><i></i><span class="sn">${esc(k)}</span><span class="sc">${bySrc[k]}</span></div>`));
  const items = (rows.join('') || '<div class="src-item">no scan data yet</div>')
    + `<div class="src-menu-note"><b>live</b> in scope <span class="scanned">/ total scanned</span> — live totals ${live.length}; scanned counts are pre-filter.</div>`;
  document.getElementById('kpis').innerHTML =
      `<div class="kpi"><div class="kpi-n">${live.length}</div><div class="kpi-l">Live tenders</div></div>`
    + `<div class="kpi ${soon?'hot':''}"><div class="kpi-n">${soon}</div><div class="kpi-l">Closing ≤ 7 days</div></div>`
    + `<div class="kpi ${fresh?'fresh':''}"><div class="kpi-n">${fresh}</div><div class="kpi-l">New this scan</div></div>`
    + `<button class="kpi src-kpi ${(entries.length&&ok<entries.length)?'warn':''} ${srcOpen?'open':''}" id="srcKpi" aria-haspopup="true" aria-expanded="${srcOpen}">`
    +   `<div class="kpi-n">${entries.length?ok+'/'+entries.length:'—'}<svg class="caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5 9 4.5"/></svg></div>`
    +   `<div class="kpi-l">Sources online</div>`
    +   `<div class="src-menu"><div class="src-menu-h">Live tenders by source${entries.length?' ('+entries.length+')':''}</div>${items}</div>`
    + `</button>`;
}

function render(){
  const q = document.getElementById('q').value.toLowerCase();
  const fit = document.getElementById('fit').value;
  const src = document.getElementById('src').value;
  const soon = document.getElementById('soon').checked;
  const rows = data().filter(t=>{
    if(DISMISSED.has(keyOf(t))) return false;
    if(q && !((t.title||'')+' '+(t.buyer||'')+' '+(t.ref||'')).toLowerCase().includes(q)) return false;
    if(fit && t.fit!==fit) return false;
    if(src && t.source!==src) return false;
    if(soon){ const d=daysLeft(t.closing); if(d===null||d>7||d<0) return false; }
    return true;
  }).sort((a,b)=>
    (b.first_seen||'').localeCompare(a.first_seen||'')     // newest scan first
    || (a.closing||'9999').localeCompare(b.closing||'9999') // then soonest to close
  );

  const hid = data().filter(t=>DISMISSED.has(keyOf(t))).length;
  document.getElementById('count').innerHTML =
    `${rows.length} of ${data().length} ${tab==='live'?'live tenders':'archived tenders'}`
    + (hid ? ` · ${hid} hidden · <button class="linkbtn" onclick="restoreAll()">restore all</button>` : '');
  document.getElementById('rows').innerHTML = rows.map(t=>{
    const cls = t.fit==='Direct fit' ? 'direct' : 'bundle';
    const label = t.fit==='Direct fit' ? 'Direct' : 'Subcon';
    const url = t.url||'#';
    return `
    <tr class="item ${cls}">
      <td class="c-tender">
        <a class="titlelink" href="${url}" target="_blank" rel="noopener"><span class="title">${esc(t.title)}</span></a>
        <div class="buyer">${esc(t.buyer||'')}<span class="show-m"> · <a class="src" href="${url}" target="_blank" rel="noopener">${esc(t.source)} ↗</a> <button class="copyref" data-ref="${esc(t.ref||t.title)}">Copy</button></span></div>
      </td>
      <td><span class="tag ${cls}"><i></i>${label}</span></td>
      <td class="hide-m src-cell"><a class="src" href="${url}" target="_blank" rel="noopener">${esc(t.source)} ↗</a><div class="ref mono">${esc(t.ref||'—')}${t.ref?` <button class="copyref" data-ref="${esc(t.ref)}">Copy</button>`:''}</div></td>
      <td class="hide-m dt mono">${fmt(t.published)}</td>
      <td class="dt mono">${fmt(t.first_seen)}${isNew(t)?' <span class="new">NEW</span>':''}</td>
      <td class="dt mono">${fmt(t.closing)}</td>
      <td>${tab==='archive' ? '<span class="cd gone">Archived</span>' : stamp(t.closing)}</td>
      <td class="act"><button class="del" data-key="${esc(keyOf(t))}" title="Hide this tender for everyone" aria-label="Hide this tender">✕</button></td>
    </tr>`;
  }).join('');
  document.getElementById('empty').hidden = rows.length>0;
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function isNew(t){ return !!(t.first_seen && STATUS.run_at && t.first_seen===STATUS.run_at.slice(0,10)); }

// Shared "hidden tenders" list, stored in Supabase and keyed like scraper.py's
// key_of() so hides survive re-scrapes. Hiding a tender syncs it to every
// visitor, and the weekly scan drops it from tenders.json. localStorage is an
// offline cache so hides show instantly and persist if Supabase is briefly
// unreachable. The publishable key is safe in client code (access is gated by
// row-level security on the dismissals table).
const SB_URL = 'https://drgvmnetkqbnwtuqzgvi.supabase.co';
const SB_KEY = 'sb_publishable_t04rG7cIzuhDp-qamnuj0g_xwFx5oez';
const sbHeaders = { apikey: SB_KEY, Authorization: 'Bearer '+SB_KEY, 'Content-Type':'application/json' };
function keyOf(t){ return (t.source||'')+'|'+(t.ref||'')+'|'+(t.title||'').slice(0,120).toLowerCase(); }
let DISMISSED = new Set(JSON.parse(localStorage.getItem('tw_dismissed')||'[]'));
function cacheDismissed(){ localStorage.setItem('tw_dismissed', JSON.stringify([...DISMISSED])); }

async function loadDismissed(){
  try{
    const r = await fetch(SB_URL+'/rest/v1/dismissals?select=key', {headers:sbHeaders});
    if(r.ok){ DISMISSED = new Set((await r.json()).map(x=>x.key).filter(Boolean)); cacheDismissed(); }
  }catch(e){ /* offline: fall back to the localStorage cache */ }
}

async function hideTender(key){
  DISMISSED.add(key); cacheDismissed(); render(); updateKpis(); showUndo(key);
  const t = [...LIVE, ...ARCH].find(x=>keyOf(x)===key) || {};
  try{
    const r = await fetch(SB_URL+'/rest/v1/dismissals', {
      method:'POST', headers:{...sbHeaders, Prefer:'resolution=merge-duplicates'},
      body: JSON.stringify([{key, source:t.source||'', ref:t.ref||'', title:t.title||''}])
    });
    if(!r.ok) throw 0;
  }catch(e){ flash('Offline — hidden here, but not synced to others yet.', false); }
}

async function unhide(key){
  DISMISSED.delete(key); cacheDismissed(); render(); updateKpis();
  try{ await fetch(SB_URL+'/rest/v1/dismissals?key=eq.'+encodeURIComponent(key), {method:'DELETE', headers:sbHeaders}); }catch(e){}
}

async function restoreAll(){
  if(!DISMISSED.size) return;
  const keys=[...DISMISSED]; DISMISSED.clear(); cacheDismissed(); render(); updateKpis();
  try{ await Promise.all(keys.map(k=>fetch(SB_URL+'/rest/v1/dismissals?key=eq.'+encodeURIComponent(k), {method:'DELETE', headers:sbHeaders}))); }catch(e){}
}

let undoTimer=null;
function flash(msg, withUndo){
  const t=document.getElementById('toast');
  t.querySelector('.msg').textContent=msg;
  t.querySelector('button').style.display = withUndo?'':'none';
  t.classList.add('show'); clearTimeout(undoTimer);
  undoTimer=setTimeout(()=>{ t.classList.remove('show'); t.querySelector('button').style.display=''; }, withUndo?6000:4500);
  return t;
}
function showUndo(key){
  const t=flash('Tender hidden for everyone.', true);
  t.querySelector('button').onclick=()=>{ unhide(key); t.classList.remove('show'); };
}

document.getElementById('rows').addEventListener('click', e=>{
  const del = e.target.closest('.del');
  if(del){ hideTender(del.dataset.key); return; }
  const btn = e.target.closest('.copyref');
  if(!btn) return;
  const val = btn.dataset.ref;
  const orig = btn.textContent;
  navigator.clipboard.writeText(val).then(()=>{
    btn.textContent = 'Copied!';
    setTimeout(()=>{ btn.textContent = orig; }, 1400);
  }).catch(()=>{
    btn.textContent = 'Failed';
    setTimeout(()=>{ btn.textContent = orig; }, 1400);
  });
});

function setSrcOpen(v){
  srcOpen=v;
  const t=document.getElementById('srcKpi');
  if(t){ t.classList.toggle('open', v); t.setAttribute('aria-expanded', v); }
}
document.getElementById('kpis').addEventListener('click', e=>{
  const tile=e.target.closest('.src-kpi');
  if(!tile || e.target.closest('.src-menu')) return;   // ignore clicks inside the open menu
  setSrcOpen(!srcOpen);
});
document.addEventListener('click', e=>{ if(srcOpen && !e.target.closest('.src-kpi')) setSrcOpen(false); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && srcOpen) setSrcOpen(false); });

function downloadXlsx(){
  const cols = t => ({
    Title:t.title, Buyer:t.buyer, Fit:t.fit, Source:t.source, Ref:t.ref||'',
    Type:t.type||'', Category:t.category||'', Published:t.published||'',
    Closing:t.closing||'', DaysLeft:daysLeft(t.closing) ?? '', URL:t.url||'',
    FirstSeen:t.first_seen||'', ArchivedOn:t.archived_on||''
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(LIVE.map(cols)), 'Live');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ARCH.map(cols)), 'Archive');
  XLSX.writeFile(wb, `tenders-watch-${new Date().toISOString().slice(0,10)}.xlsx`);
}

async function load(){
  const j = async f => { try{ return await (await fetch(f+'?t='+Date.now())).json(); }catch(e){ return null; } };
  LIVE = await j('tenders.json') || [];
  ARCH = await j('archive.json') || [];
  STATUS = await j('status.json') || {};
  await loadDismissed();
  const srcs=[...new Set([...LIVE,...ARCH].map(t=>t.source))].sort();
  document.getElementById('src').innerHTML = '<option value="">All sources</option>'+srcs.map(s=>`<option>${esc(s)}</option>`).join('');
  document.getElementById('runAt').textContent = STATUS.run_at ? 'Scanned '+STATUS.run_at.slice(0,16).replace('T',' ')+' SGT' : 'no scan data';
  document.getElementById('health').innerHTML =
    `<div class="health-note">Scans run Mondays ~14:17 SGT · source list in the “Sources online” panel above · ${STATUS.dismissed?STATUS.dismissed+' hidden · ':''}archive holds lapsed tenders</div>`;
  updateKpis();
  render();
}
load();
</script>
